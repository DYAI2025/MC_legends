name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Production runs PostgreSQL 17.10 (srv1308064.hstgr.cloud, observed 2026-08-13).
    # Local development runs 15.18, so CI is the only place the production major is
    # exercised at all.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Require committed lockfile
        shell: bash
        run: |
          test -f package-lock.json
          git ls-files --error-unmatch package-lock.json
          test -z "$(git status --porcelain -- package-lock.json)"

      - name: Foundation structure
        run: npm run check:foundation

      - name: Secret scan
        run: npm run check:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # DATABASE_URL is scoped to THIS step and nowhere else. The composition root selects
      # the PostgreSQL store whenever it is set and non-blank, so a job-level DATABASE_URL
      # would silently change what the unit suite is testing.
      - name: Migrate test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcl_test

      # MCL_TEST_DATABASE_URL (not DATABASE_URL) un-skips the three suites under
      # tests/integration/; the unit suite keeps running against the file store.
      - name: Unit, architecture and integration tests
        run: npm run test
        env:
          MCL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcl_test

      # The step above exits 0 whether the integration suites ran or skipped themselves.
      # This one fails unless every integration test actually executed and passed.
      - name: Prove the integration suites ran
        run: npm run check:integration-ran
        env:
          MCL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcl_test

      # Distinctive canary values, so the scan below is looking for something that was
      # actually present while the client bundle was produced. Every variable the scan
      # knows about has to be set here: the scan drops unset ones from its list and
      # still reports ok, so a name missing from this block is a name nobody checks.
      - name: Build
        run: npm run build
        env:
          AVALORIA_FAMILY_ACCESS_CODE: ci-canary-family-code-9f3b7d21
          AVALORIA_SESSION_SECRET: ci-canary-session-secret-4c81ea60
          AVALORIA_ADMIN_ACCESS_CODE: ci-canary-admin-code-7a2d5f14

      - name: Client bundle secret scan
        run: npm run check:client-secrets
        env:
          AVALORIA_FAMILY_ACCESS_CODE: ci-canary-family-code-9f3b7d21
          AVALORIA_SESSION_SECRET: ci-canary-session-secret-4c81ea60
          AVALORIA_ADMIN_ACCESS_CODE: ci-canary-admin-code-7a2d5f14

      - name: Require committed next-env types
        shell: bash
        run: test -z "$(git status --porcelain -- next-env.d.ts)"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high

  # MCL-63. The real OpenNext/Cloudflare worker build, from the repository's own
  # configuration. A separate job so the verify job above stays byte-identical and keeps
  # its PostgreSQL service, which this one does not need.
  #
  # This is the gate for the failure that shipped: `wrangler deploy` used to migrate the
  # project during the deployment build and the worker bundle then failed with
  # `Could not resolve "pg-cloudflare"`. Nothing here is mocked - esbuild really bundles
  # the worker, so that failure fails this job on its own exit code. The bundle check
  # afterwards is for the quieter regression: a build that passes because somebody put a
  # working PostgreSQL client back into the Worker.
  #
  # No Cloudflare credentials, and no deploy: this validates the build only.
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --no-fund

      # Same canary values as the Build step in the verify job, so the secret scan in
      # the next step is looking for something that was actually present while the
      # bundle was produced.
      - name: OpenNext Cloudflare build
        run: npm run build:cloudflare
        env:
          AVALORIA_FAMILY_ACCESS_CODE: ci-canary-family-code-9f3b7d21
          AVALORIA_SESSION_SECRET: ci-canary-session-secret-4c81ea60
          AVALORIA_ADMIN_ACCESS_CODE: ci-canary-admin-code-7a2d5f14

      - name: Worker bundle assertions
        run: npm run check:cloudflare-bundle
        env:
          AVALORIA_FAMILY_ACCESS_CODE: ci-canary-family-code-9f3b7d21
          AVALORIA_SESSION_SECRET: ci-canary-session-secret-4c81ea60
          AVALORIA_ADMIN_ACCESS_CODE: ci-canary-admin-code-7a2d5f14
