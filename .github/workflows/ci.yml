name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Require committed lockfile
        shell: bash
        run: |
          test -f package-lock.json
          git ls-files --error-unmatch package-lock.json
          test -z "$(git status --porcelain -- package-lock.json)"

      - name: Foundation structure
        run: npm run check:foundation

      - name: Secret scan
        run: npm run check:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and architecture tests
        run: npm run test

      # Distinctive canary values, so the scan below is looking for something that was
      # actually present while the client bundle was produced.
      - name: Build
        run: npm run build
        env:
          AVALORIA_FAMILY_ACCESS_CODE: ci-canary-family-code-9f3b7d21
          AVALORIA_SESSION_SECRET: ci-canary-session-secret-4c81ea60

      - name: Client bundle secret scan
        run: npm run check:client-secrets
        env:
          AVALORIA_FAMILY_ACCESS_CODE: ci-canary-family-code-9f3b7d21
          AVALORIA_SESSION_SECRET: ci-canary-session-secret-4c81ea60

      - name: Require committed next-env types
        shell: bash
        run: test -z "$(git status --porcelain -- next-env.d.ts)"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high
