name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm install --no-fund

      - name: Require committed lockfile
        shell: bash
        run: |
          test -f package-lock.json
          git ls-files --error-unmatch package-lock.json
          test -z "$(git status --porcelain -- package-lock.json)"

      - name: Foundation structure
        run: npm run check:foundation

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and architecture tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high
